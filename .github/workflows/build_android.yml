name: Build TickFlow Android APK & AAB

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Release APK & Play Store AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Bootstrap Android platform files
        run: flutter create --platforms=android --org com.tickflow --project-name tickflow .

      - name: Configure TickFlow branding, permissions, desugaring & launcher icons
        run: python3 scripts/configure_android.py

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Android Release APK (Direct Install)
        run: flutter build apk --release

      - name: Build Android App Bundle (Google Play Store)
        run: flutter build appbundle --release

      - name: Upload TickFlow APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TickFlow-Android-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload TickFlow Play Store AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TickFlow-PlayStore-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
