name: tickflow
description: TickFlow — Plan simply, finish smoothly. A modern Material 3 Android Todo & Productivity app built with Flutter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.2
  intl: ">=0.19.0 <0.21.0"
  flutter_local_notifications: ^18.0.1
  timezone: ">=0.9.2 <0.11.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon/tickflow_logo.png
